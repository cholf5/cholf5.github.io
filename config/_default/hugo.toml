# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/getting-started/

baseURL = "https://cholf5.com/"
theme = "congo"
defaultContentLanguage = "zh-Hans"

# When enabled, a robots.txt file will be created in the site root that allows
# search engines to crawl the entire site. If you prefer to provide your own
# pre-made robots.txt, set to false and place your file in the static directory.
# For complete control, you may provide a custom layout to generate this file.
enableRobotsTXT = true

# The number of words that are used to generate the article summary when one
# is not provided in the front matter. A value of 0 will use the first sentence.
# This value has no effect when summaries are hidden.
summaryLength = 50

# Whether to enable CJK language support
hasCJKLanguage = true

# The number of articles listed on each page of the article listing.
[pagination]
  pagerSize = 15

# The output formats that are generated for the site. Congo requires HTML, RSS
# and JSON for all theme components to work correctly.
[outputs]
  home = ["HTML", "RSS", "JSON"]

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[services]
  [services.x]
    disableInlineCSS = true

googleAnalytics = "G-MEWXJB3X55"
